name: Build Vivek AI Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Web Dependencies
        run: npm ci || npm install

      - name: Build Web Application
        run: npm run build

      - name: Prepare Android Web Assets Directory
        run: |
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          echo "Assets copied successfully into android/app/src/main/assets/public"

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant Executable Permission for Gradlew
        run: |
          chmod +x android/gradlew || true

      - name: Build Debug APK with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Generated APK
        run: |
          ls -la android/app/build/outputs/apk/debug/
          test -f android/app/build/outputs/apk/debug/app-debug.apk && echo "APK successfully verified!"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vivek-AI-debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
